name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec install-electron
      - run: npm run prepare:runtime
      - run: npm test
      - run: npm run package
      - name: Keep built installers for release recovery
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Verify files and publish draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable package version.' }
          $tag = 'v' + $version
          $repo = $env:GITHUB_REPOSITORY
          $tagRefs = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the release tag.' }
          if ($tagRefs.Count -gt 0) {
            $peeled = $tagRefs | Where-Object { $_.EndsWith('^{}') } | Select-Object -First 1
            if (!$peeled) { $peeled = $tagRefs[0] }
            if (($peeled -split '\s+')[0] -ne $env:GITHUB_SHA) {
              throw 'The version tag already points to another commit; bump the package version.'
            }
          }
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases.' }
          $release = $releases | Where-Object tag_name -EQ $tag | Select-Object -First 1
          if (!$release) {
            gh release create $tag --repo $repo --draft --target $env:GITHUB_SHA --title "PaperDesk $version" --notes "Windows x64。安装程序可自选目录；ZIP 解压后运行 PaperDesk.exe。使用说明见仓库 README。源码使用 MIT 许可证；安装包未进行代码签名。"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release.' }
            $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read draft release.' }
            $release = $releases | Where-Object tag_name -EQ $tag | Select-Object -First 1
          }
          if (!$release -or !$release.draft) { throw 'Only unpublished drafts can be updated. Bump package version for a new release.' }
          $releaseId = $release.id
          gh api --method PATCH "repos/$repo/releases/$releaseId" -f "target_commitish=$env:GITHUB_SHA" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Cannot set release commit.' }
          $files = @("release/PaperDesk-$version-x64.exe", "release/PaperDesk-$version-x64.zip")
          $checksums = foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" }
            (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower() + '  ' + [IO.Path]::GetFileName($file)
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release/SHA256SUMS.txt'), [string[]]$checksums, [Text.UTF8Encoding]::new($false))
          $assets = $files + @('release/SHA256SUMS.txt')
          $existingAssets = gh api "repos/$repo/releases/$releaseId/assets" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect draft assets.' }
          $uploadHeaders = @{
            Authorization = 'Bearer ' + $env:GH_TOKEN
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            $digest = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            $existing = $existingAssets | Where-Object name -EQ $name | Select-Object -First 1
            if ($existing -and $existing.state -eq 'uploaded' -and $existing.digest -eq $digest) { continue }
            if ($existing) {
              gh api --method DELETE "repos/$repo/releases/assets/$($existing.id)" --silent
              if ($LASTEXITCODE -ne 0) { throw "Cannot replace incomplete draft asset $name." }
            }
            Write-Output "Uploading $name to draft release $releaseId"
            $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets?name=" + [Uri]::EscapeDataString($name)
            $asset = Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $uploadHeaders -ContentType 'application/octet-stream' -InFile (Resolve-Path -LiteralPath $file).Path -TimeoutSec 600
            if ($asset.state -ne 'uploaded' -or $asset.digest -ne $digest) {
              throw "Upload checksum verification failed for $name; release remains a draft."
            }
          }
          $uploaded = gh api "repos/$repo/releases/$releaseId/assets" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify assets.' }
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            $asset = $uploaded | Where-Object name -EQ $name | Select-Object -First 1
            $digest = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            if (!$asset -or $asset.state -ne 'uploaded' -or $asset.digest -ne $digest) {
              throw "Checksum verification failed for $name; release remains a draft."
            }
          }
          gh api --method PATCH "repos/$repo/releases/$releaseId" -F draft=false -f make_latest=true --silent
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish verified release.' }
          Write-Output "Published https://github.com/$repo/releases/tag/$tag"
