name: Build Windows release
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: '可选：复用已通过测试和打包的本仓库构建记录编号'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    if: inputs.reuse_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec install-electron
      - run: npm run prepare:runtime
      - run: npm test
      - run: npm run package
      - name: Keep built installers for release recovery
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
  publish:
    needs: build
    if: always() && !cancelled() && (needs.build.result == 'success' || inputs.reuse_run_id != '')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select verified build artifacts
        id: build
        uses: actions/github-script@v7
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        with:
          script: |
            const requested = process.env.REUSE_RUN_ID || String(context.runId);
            if (!/^\d+$/.test(requested)) throw new Error('Invalid workflow run ID.');
            const run_id = Number(requested);
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.head_repository?.full_name !== owner + '/' + repo || run.event !== 'workflow_dispatch') {
              throw new Error('Only manual builds from this repository can be released.');
            }
            const { data: jobData } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id, filter: 'latest', per_page: 100 });
            const steps = jobData.jobs.flatMap(job => job.steps || []);
            for (const name of ['Run npm test', 'Run npm run package', 'Keep built installers for release recovery']) {
              if (!steps.some(step => step.name === name && step.conclusion === 'success')) {
                throw new Error('Build prerequisite did not pass: ' + name);
              }
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id, per_page: 100 });
            const artifact = data.artifacts.find(item => item.name === 'windows-installers' && !item.expired);
            if (!artifact) throw new Error('Verified installer artifact is unavailable.');
            core.setOutput('artifact_id', String(artifact.id));
            core.setOutput('run_id', String(run_id));
            core.setOutput('commit', run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.build.outputs.artifact_id }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Verify files and publish release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.build.outputs.commit }}
